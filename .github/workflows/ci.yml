name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the repository.
permissions:
  contents: read

jobs:
  sdk:
    name: SDK (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Run the documented release checks
        run: node packages/sdk/scripts/docs-commands.mjs release

      - name: Run the documented workspace examples against the tarball
        run: node packages/sdk/scripts/docs-commands.mjs examples
