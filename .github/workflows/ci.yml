name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the repository.
permissions:
  contents: read

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Format
        run: corepack pnpm format:check

      - name: Registry checksum
        run: corepack pnpm registry:checksum

      - name: Neutrality guard
        run: corepack pnpm neutrality:guard

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Pack dry run
        run: corepack pnpm pack:dry-run

      - name: Package contents
        run: corepack pnpm package:contents

      - name: Export smoke
        run: corepack pnpm exports:smoke
