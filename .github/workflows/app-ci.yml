name: App CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-ci.yml"

# The job only reads the repository.
permissions:
  contents: read

jobs:
  zodia:
    name: Zodia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm --filter zodia typecheck

      - name: Test
        run: corepack pnpm --filter zodia test

      - name: Build SDK
        run: corepack pnpm --filter @zodiacs/sdk build

      - name: Build
        run: corepack pnpm --filter zodia build
