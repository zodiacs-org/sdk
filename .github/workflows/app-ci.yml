name: App CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-ci.yml"

# The job only reads the repository.
permissions:
  contents: read

jobs:
  zodia:
    name: Zodia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm --filter zodia typecheck

      - name: Test
        run: corepack pnpm --filter zodia test

      - name: Build SDK
        run: corepack pnpm --filter @zodiacs/sdk build

      - name: Build
        run: corepack pnpm --filter zodia build
