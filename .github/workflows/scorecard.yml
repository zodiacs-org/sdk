name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Mondays at 04:47 UTC.
    - cron: "47 4 * * 1"

# No permissions by default; the job asks for what it needs.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Check out the repository.
      contents: read
      # Upload the results to code scanning.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Do not send the results to the public Scorecard API
          # (api.scorecard.dev). They go only to this repository's code
          # scanning, so no Scorecard badge is published and the job needs
          # no id-token permission.
          publish_results: false

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
